<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HackHorizon — Intelligent Emergency Response and Accident Alert System. AI-powered accident detection, one-tap SOS, nearby hospital finder with live traffic routing." />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HackHorizon" />
    <link rel="manifest" href="/manifest.json" />
    <title>HackHorizon — Emergency Response System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then((reg) => console.log("[PWA] Service worker registered:", reg.scope))
            .catch((err) => console.warn("[PWA] SW registration failed:", err));
        });
      }
    </script>
  </body>
</html>
